<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">OfferPSP private payment provider matching flow</title>
  <desc id="desc">A four-step flow from merchant profile through provider screening and shortlist to a qualified introduction.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151a29"/>
      <stop offset="1" stop-color="#0b0e18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d7a"/>
      <stop offset="1" stop-color="#ff7c9c"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect width="1200" height="520" rx="34" fill="url(#background)"/>
  <circle cx="1080" cy="40" r="150" fill="#ff4d7a" opacity=".08" filter="url(#glow)"/>
  <text x="72" y="82" fill="#ff6c91" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4">PRIVATE MATCHING FLOW</text>
  <text x="72" y="126" fill="#f6f3ec" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">From operating facts to a qualified PSP conversation</text>
  <path d="M194 285H1006" stroke="#3a4050" stroke-width="4" stroke-linecap="round"/>
  <path d="M194 285H1006" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-dasharray="170 100" opacity=".9"/>
  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(72 205)">
      <rect width="244" height="190" rx="22" fill="#111522" stroke="#353b4a"/>
      <circle cx="46" cy="80" r="27" fill="#ff4d7a"/>
      <text x="46" y="87" text-anchor="middle" fill="#080a13" font-size="18" font-weight="800">01</text>
      <text x="28" y="130" fill="#f6f3ec" font-size="20" font-weight="700">Merchant profile</text>
      <text x="28" y="160" fill="#a7abb6" font-size="15">Entity · GEOs · methods · volume</text>
    </g>
    <g transform="translate(342 205)">
      <rect width="244" height="190" rx="22" fill="#111522" stroke="#353b4a"/>
      <circle cx="46" cy="80" r="27" fill="#ff4d7a"/>
      <text x="46" y="87" text-anchor="middle" fill="#080a13" font-size="18" font-weight="800">02</text>
      <text x="28" y="130" fill="#f6f3ec" font-size="20" font-weight="700">Practical screening</text>
      <text x="28" y="160" fill="#a7abb6" font-size="15">Coverage · risk · integration</text>
    </g>
    <g transform="translate(612 205)">
      <rect width="244" height="190" rx="22" fill="#111522" stroke="#353b4a"/>
      <circle cx="46" cy="80" r="27" fill="#ff4d7a"/>
      <text x="46" y="87" text-anchor="middle" fill="#080a13" font-size="18" font-weight="800">03</text>
      <text x="28" y="130" fill="#f6f3ec" font-size="20" font-weight="700">Focused shortlist</text>
      <text x="28" y="160" fill="#a7abb6" font-size="15">Relevant routes with clear reasons</text>
    </g>
    <g transform="translate(882 205)">
      <rect width="246" height="190" rx="22" fill="#161c2a" stroke="#ff4d7a" stroke-width="2"/>
      <circle cx="46" cy="80" r="27" fill="#a7f3d0"/>
      <text x="46" y="87" text-anchor="middle" fill="#080a13" font-size="18" font-weight="800">04</text>
      <text x="28" y="130" fill="#f6f3ec" font-size="20" font-weight="700">Warm introduction</text>
      <text x="28" y="160" fill="#a7abb6" font-size="15">Provider interest · context intact</text>
    </g>
  </g>
  <text x="72" y="465" fill="#777d8a" font-family="Inter, Arial, sans-serif" font-size="14">OfferPSP qualifies and introduces. Independent PSPs make all underwriting and commercial decisions.</text>
</svg>
