<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1040" viewBox="0 0 720 1040" role="img" aria-labelledby="title desc">
  <title id="title">Payment provider matching brief for mobile screens</title>
  <desc id="desc">A mobile diagram listing entity, licensing, customer geography, methods, currencies, volume, risk and settlement in one payment brief.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171c2b"/><stop offset="1" stop-color="#0b0e18"/>
    </linearGradient>
  </defs>
  <rect width="720" height="1040" rx="30" fill="url(#background)"/>
  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(52 50)">
      <rect width="616" height="150" rx="26" fill="#111522" stroke="#ff4d7a" stroke-width="2"/>
      <text x="308" y="48" text-anchor="middle" fill="#ff6c91" font-size="15" font-weight="800" letter-spacing="3">OFFERPSP</text>
      <text x="308" y="90" text-anchor="middle" fill="#f6f3ec" font-size="30" font-weight="750">PAYMENT BRIEF</text>
      <text x="308" y="122" text-anchor="middle" fill="#a7abb6" font-size="15">One profile · relevant provider routes</text>
    </g>
    <g fill="#151a29" stroke="#353b4a">
      <rect x="52" y="232" width="298" height="140" rx="20"/><rect x="370" y="232" width="298" height="140" rx="20"/>
      <rect x="52" y="392" width="298" height="140" rx="20"/><rect x="370" y="392" width="298" height="140" rx="20"/>
      <rect x="52" y="552" width="298" height="140" rx="20"/><rect x="370" y="552" width="298" height="140" rx="20"/>
      <rect x="52" y="712" width="298" height="140" rx="20"/><rect x="370" y="712" width="298" height="140" rx="20"/>
    </g>
    <g fill="#f6f3ec" font-size="18" font-weight="700">
      <text x="78" y="276">ENTITY</text><text x="78" y="308" fill="#a7abb6" font-size="14" font-weight="500">Ownership and</text><text x="78" y="332" fill="#a7abb6" font-size="14" font-weight="500">contracting party</text>
      <text x="396" y="276">LICENSING</text><text x="396" y="308" fill="#a7abb6" font-size="14" font-weight="500">Regulatory status</text><text x="396" y="332" fill="#a7abb6" font-size="14" font-weight="500">and target markets</text>
      <text x="78" y="436">CUSTOMER GEOs</text><text x="78" y="468" fill="#a7abb6" font-size="14" font-weight="500">Countries and</text><text x="78" y="492" fill="#a7abb6" font-size="14" font-weight="500">launch order</text>
      <text x="396" y="436">METHODS</text><text x="396" y="468" fill="#a7abb6" font-size="14" font-weight="500">Cards · banks</text><text x="396" y="492" fill="#a7abb6" font-size="14" font-weight="500">wallets · payouts</text>
      <text x="78" y="596">CURRENCIES</text><text x="78" y="628" fill="#a7abb6" font-size="14" font-weight="500">Presentment and</text><text x="78" y="652" fill="#a7abb6" font-size="14" font-weight="500">settlement</text>
      <text x="396" y="596">VOLUME</text><text x="396" y="628" fill="#a7abb6" font-size="14" font-weight="500">Ticket size and</text><text x="396" y="652" fill="#a7abb6" font-size="14" font-weight="500">realistic forecast</text>
      <text x="78" y="756">RISK PROFILE</text><text x="78" y="788" fill="#a7abb6" font-size="14" font-weight="500">Disputes, fraud</text><text x="78" y="812" fill="#a7abb6" font-size="14" font-weight="500">and controls</text>
      <text x="396" y="756">SETTLEMENT</text><text x="396" y="788" fill="#a7abb6" font-size="14" font-weight="500">Timing, reserves</text><text x="396" y="812" fill="#a7abb6" font-size="14" font-weight="500">and reporting</text>
    </g>
    <text x="52" y="920" fill="#ff6c91" font-size="16" font-weight="700" letter-spacing="2">PROFILE-SPECIFIC MATCHING</text>
    <text x="52" y="958" fill="#a7abb6" font-size="15">The complete brief is screened against current</text>
    <text x="52" y="984" fill="#a7abb6" font-size="15">provider requirements before any introduction.</text>
  </g>
</svg>
