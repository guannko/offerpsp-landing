<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc">
  <title id="title">OfferPSP private payment provider matching flow for mobile screens</title>
  <desc id="desc">Four stacked steps from merchant profile through screening and shortlist to a qualified provider introduction.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151a29"/><stop offset="1" stop-color="#0b0e18"/>
    </linearGradient>
  </defs>
  <rect width="720" height="1080" rx="30" fill="url(#background)"/>
  <text x="52" y="70" fill="#ff6c91" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="3">PRIVATE MATCHING FLOW</text>
  <text x="52" y="116" fill="#f6f3ec" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">From operating facts to a qualified</text>
  <text x="52" y="151" fill="#f6f3ec" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">PSP conversation</text>
  <path d="M100 254V835" stroke="#ff4d7a" stroke-width="4" stroke-linecap="round" opacity=".8"/>
  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(52 205)">
      <rect width="616" height="160" rx="22" fill="#111522" stroke="#353b4a"/>
      <circle cx="48" cy="49" r="28" fill="#ff4d7a"/><text x="48" y="56" text-anchor="middle" fill="#080a13" font-size="18" font-weight="800">01</text>
      <text x="98" y="52" fill="#f6f3ec" font-size="22" font-weight="700">Merchant profile</text>
      <text x="98" y="86" fill="#a7abb6" font-size="16">Entity · licensing · GEOs · methods</text>
      <text x="98" y="116" fill="#a7abb6" font-size="16">Current processing · realistic volume</text>
    </g>
    <g transform="translate(52 389)">
      <rect width="616" height="160" rx="22" fill="#111522" stroke="#353b4a"/>
      <circle cx="48" cy="49" r="28" fill="#ff4d7a"/><text x="48" y="56" text-anchor="middle" fill="#080a13" font-size="18" font-weight="800">02</text>
      <text x="98" y="52" fill="#f6f3ec" font-size="22" font-weight="700">Practical screening</text>
      <text x="98" y="86" fill="#a7abb6" font-size="16">Coverage · risk appetite · integration</text>
      <text x="98" y="116" fill="#a7abb6" font-size="16">Limits · settlement · operating fit</text>
    </g>
    <g transform="translate(52 573)">
      <rect width="616" height="160" rx="22" fill="#111522" stroke="#353b4a"/>
      <circle cx="48" cy="49" r="28" fill="#ff4d7a"/><text x="48" y="56" text-anchor="middle" fill="#080a13" font-size="18" font-weight="800">03</text>
      <text x="98" y="52" fill="#f6f3ec" font-size="22" font-weight="700">Focused shortlist</text>
      <text x="98" y="86" fill="#a7abb6" font-size="16">Relevant routes with a clear reason</text>
      <text x="98" y="116" fill="#a7abb6" font-size="16">No public provider database dump</text>
    </g>
    <g transform="translate(52 757)">
      <rect width="616" height="160" rx="22" fill="#161c2a" stroke="#ff4d7a" stroke-width="2"/>
      <circle cx="48" cy="49" r="28" fill="#a7f3d0"/><text x="48" y="56" text-anchor="middle" fill="#080a13" font-size="18" font-weight="800">04</text>
      <text x="98" y="52" fill="#f6f3ec" font-size="22" font-weight="700">Warm introduction</text>
      <text x="98" y="86" fill="#a7abb6" font-size="16">Provider interest confirmed</text>
      <text x="98" y="116" fill="#a7abb6" font-size="16">Qualification context stays intact</text>
    </g>
  </g>
  <text x="52" y="980" fill="#777d8a" font-family="Inter, Arial, sans-serif" font-size="14">OfferPSP qualifies and introduces.</text>
  <text x="52" y="1007" fill="#777d8a" font-family="Inter, Arial, sans-serif" font-size="14">Independent PSPs make underwriting and commercial decisions.</text>
</svg>
