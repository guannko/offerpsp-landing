<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">OfferPSP X cover</title>
  <desc id="desc">OfferPSP private payment-provider matching for international merchants</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080a13"/>
      <stop offset="0.58" stop-color="#0d101c"/>
      <stop offset="1" stop-color="#17091a"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4778"/>
      <stop offset="1" stop-color="#ff7899"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="42%" r="58%">
      <stop offset="0" stop-color="#ff4778" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff4778" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1500" height="500" fill="url(#background)"/>
  <rect width="1500" height="500" fill="url(#glow)"/>
  <rect width="1500" height="500" fill="url(#grid)"/>
  <path d="M0 0H18V500H0Z" fill="url(#brand)"/>
  <circle cx="1408" cy="54" r="144" fill="#ff4778" opacity="0.055"/>
  <circle cx="1470" cy="446" r="205" fill="#ff7899" opacity="0.04"/>

  <!-- The left side stays intentionally quiet because the X avatar overlaps it. -->
  <g transform="translate(500 64)">
    <rect x="0" y="0" width="390" height="92" rx="2" fill="none" stroke="url(#brand)" stroke-width="8"/>
    <text x="195" y="65" text-anchor="middle" fill="url(#brand)" font-family="Arial Black, Arial, sans-serif" font-size="50" font-weight="900">OfferPSP</text>

    <text x="0" y="226" fill="#fffaf4" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.8">Private PSP matching</text>
    <text x="0" y="278" fill="#c2c6d1" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500">Structured briefs · provider review · controlled introductions</text>

    <g transform="translate(0 326)">
      <circle cx="8" cy="8" r="8" fill="#ff4778"/>
      <text x="30" y="16" fill="#dfe2ea" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="1.2">iGaming · FOREX · E-COMMERCE · SaaS · HIGH-RISK</text>
    </g>
  </g>

  <text x="1432" y="455" text-anchor="end" fill="#ff7899" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" letter-spacing="0.9">offerpsp.com</text>
</svg>
