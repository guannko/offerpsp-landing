      <text x="26" y="13" fill="#d9dce4" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.2">iGaming · FOREX · E-COMMERCE · SaaS · HIGH-RISK</text>
