<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396" role="img" aria-labelledby="title desc">
  <title id="title">OfferPSP LinkedIn cover</title>
  <desc id="desc">OfferPSP private payment-provider matching for international merchants</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080a13"/>
      <stop offset="0.58" stop-color="#0d101c"/>
      <stop offset="1" stop-color="#17091a"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4778"/>
      <stop offset="1" stop-color="#ff7899"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="44%" r="58%">
      <stop offset="0" stop-color="#ff4778" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#ff4778" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1584" height="396" fill="url(#background)"/>
  <rect width="1584" height="396" fill="url(#glow)"/>
  <rect width="1584" height="396" fill="url(#grid)"/>

  <path d="M0 0H18V396H0Z" fill="url(#brand)"/>
  <circle cx="1486" cy="40" r="116" fill="#ff4778" opacity="0.06"/>
  <circle cx="1542" cy="342" r="170" fill="#ff7899" opacity="0.045"/>

  <g transform="translate(520 62)">
    <rect x="0" y="0" width="390" height="91" rx="2" fill="none" stroke="url(#brand)" stroke-width="8"/>
    <text x="195" y="64" text-anchor="middle" fill="url(#brand)" font-family="Arial Black, Arial, sans-serif" font-size="50" font-weight="900" letter-spacing="0">OfferPSP</text>

    <text x="0" y="202" fill="#fffaf4" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="800" letter-spacing="-0.7">Private PSP matching</text>
    <text x="0" y="246" fill="#b9beca" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500">Qualified options and managed introductions for international merchants.</text>

    <g transform="translate(0 282)">
