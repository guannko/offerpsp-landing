services:
  meilisearch:
    image: getmeili/meilisearch:v1.22
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:?required}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    ports:
      - "127.0.0.1:7700:7700"

  docling:
    image: ${DOCLING_IMAGE:-quay.io/docling-project/docling-serve:latest}
    restart: unless-stopped
    environment:
      DOCLING_SERVE_API_KEY: ${DOCLING_SERVE_API_KEY:?required}
    ports:
      - "127.0.0.1:5001:5001"

volumes:
  meili_data:
